[server_config]
log_path = "logs/commander.log"
log_level = "INFO"
clear_log = "True"
listen_addr = "0.0.0.0"
listen_port = 9003
workers = 2
register_name = "job-center"
uuid = "x"
master_addr = "127.0.0.1"
master_port = 8000
allowed_origin_list = ["http://localhost:3000", "http://127.0.0.1:3000"]
# CORS 允许的请求方法（覆盖全仓库路由实际用到的方法 + OPTIONS 预检）
allowed_methods = ["GET", "POST", "PATCH", "DELETE", "PUT", "OPTIONS"]
# CORS 允许的请求头（实际请求只用到这两个）
allowed_headers = ["Content-Type", "Authorization"]
authenticate_bypass = ["/api/hey", "/api/manage/refresh_master"]

[db_config]
db_str = "postgres://postgres:password@localhost:5432/job_center"

[mq_config]
mq_str = "amqp://commander:commander@127.0.0.1/job_center"
queue_prefix = "job_queue"
