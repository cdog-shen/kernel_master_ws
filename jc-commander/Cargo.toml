[package]
name = "jc-commander"
version = "0.1.0"
edition = "2024"

[dependencies]
# std dependencies
once_cell = "1.21.3"
log = "0.4.27"
chrono = { version = "0.4.41", features = ["serde"] }
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"
crossbeam = '0.8.4'
# toml = "0.8.19"
# basic web dependencies
actix-web = "4.11.0"
actix-rt = "2.10.0"
actix-service = "2.0.3"
actix-cors = "0.7.1"
# DB dependencies
diesel_migrations = "2.2.0"
diesel = { version = "2.2.12", features = [
    "postgres",
    "r2d2",
    "chrono",
    "serde_json",
    "uuid",
] }
# serializtion dependencies
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.143"
uuid = { version = "1.18.0", features = ["v4"] }
# RPC dependencies
ureq = { version = "3.1.0", features = ["charset", "json"] }
# MQ dependencies
lapin = "3.2.1"
# share-lib utils
share-lib = { path = "../share-lib" }
