[package]
name = "cloud-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# std dependencies
once_cell = "1.20.3"
log = "0.4.26"
chrono = { version = "0.4.40", features = ["serde"] }
# toml = "0.8.19"
# basic web dependencies
actix-web = "4.9.0"
actix-rt = "2.10.0"
actix-service = "2.0.2"
actix-cors = "0.7.0"
futures = "0.3.31"
# DB dependencies
diesel_migrations = "2.2.0"
diesel = { version = "2.2.8", features = ["mysql", "r2d2", "chrono"] }
# serializtion dependencies
serde = "1.0.218"
serde_derive = "1.0.218"
serde_json = "1.0.140"
uuid = { version = "1.15.1", features = ["v4"] }
# RPC dependencies
ureq = { version = "2.12.1", features = ["charset", "json"] }
# MQ dependencies
# lapin = "2.5.0"
# share-lib utils
share-lib = { path = "../share-lib" }
