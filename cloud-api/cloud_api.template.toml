[server_config]
log_path = "logs/cloudapi.log"
log_level = "INFO"
clear_log = "True"
listen_addr = "127.0.0.1"
listen_port = 9002
workers = 2
register_name = "cloud-api"
uuid = "x"
master_addr = "127.0.0.1"
master_port = 8000
allowed_origin_list = ["http://localhost:3000", "http://127.0.0.1:3000"]
authenticate_bypass = ["/api/hey", "/api/refresh_master"]
python_path = "python"
script_dir = "script"

[db_config]
db_str = "postgres://postgres:password@localhost:5432/cloud_api"
