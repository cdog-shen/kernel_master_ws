[server_config]
log_path = "logs/cloudapi.log"
log_level = "INFO"
clear_log = "True"
listen_addr = "127.0.0.1"
listen_port = 9002
workers = 2
register_name = "cloud-api"
uuid = "x"
master_addr = "127.0.0.1"
master_port = 8000
allowed_origin_list = ["http://localhost:3000", "http://127.0.0.1:3000"]
# CORS 允许的请求方法（覆盖全仓库路由实际用到的方法 + OPTIONS 预检）
allowed_methods = ["GET", "POST", "PATCH", "DELETE", "PUT", "OPTIONS"]
# CORS 允许的请求头（实际请求只用到这两个）
allowed_headers = ["Content-Type", "Authorization"]
authenticate_bypass = ["/api/hey", "/api/manage/refresh_master"]
python_path = "python"
script_dir = "script"

[db_config]
db_str = "postgres://postgres:password@localhost:5432/cloud_api"
