[server_config]
log_path = "log/fileagent.log"
log_level = "DEBUG"
clear_log = "True"
listen_addr = "0.0.0.0"
listen_port = 9004
register_name = "cmdb"
master_addr = "127.0.0.1"
master_port = 8000
workers = 8
allowed_origin_list = ["http://localhost:3000", "http://127.0.0.1:3000"]
authenticate_bypass = ["/api/refresh_master"]
root = "./"