[package]
name = "cmdb-backend"
version = "0.1.0"
edition = "2024"
authors = ["Cdog Shen <shencdog@oulook.com>"]

[features]
default = []
full-schema = []

[dependencies]
# std dependencies
once_cell = "1.21.4"
log = "0.4.29"
chrono = { version = "0.4.44", features = ["serde"] }
# toml = "0.8.19"
# basic web dependencies
actix-web = "4.13.0"
actix-rt = "2.11.0"
actix-service = "2.0.3"
actix-cors = "0.7.1"
futures = "0.3.32"
# DB dependencies
diesel_migrations = "2.3.2"
diesel = { version = "2.3.9", features = [
    "postgres",
    "r2d2",
    "chrono",
    "serde_json",
    "uuid",
] }
pq-sys = { version = "0.7.5", features = ["bundled"] }
# serializtion dependencies
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
# RPC dependencies
ureq = { version = "3.3.0", features = ["charset", "json"] }
# share-lib utils
share-lib = { path = "../share-lib" }
